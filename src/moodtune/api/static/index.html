<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MoodTune</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="top">
    <div>
      <h1>MoodTune</h1>
      <p class="sub">Music suggestions from your facial expression</p>
    </div>
    <p class="privacy">Frames are analysed in memory and never stored.</p>
  </header>

  <main class="layout">
    <section class="panel input" aria-label="Input">
      <div class="tabs" role="tablist">
        <button role="tab" id="tab-camera" aria-selected="true" aria-controls="pane-camera">Camera</button>
        <button role="tab" id="tab-photo" aria-selected="false" aria-controls="pane-photo">Photo</button>
      </div>

      <div id="pane-camera" role="tabpanel" aria-labelledby="tab-camera">
        <div class="stage mirrored">
          <video id="video" playsinline muted></video>
          <canvas id="overlay" aria-hidden="true"></canvas>
          <div id="camera-empty" class="stage-empty">Camera is off</div>
        </div>
        <div class="controls">
          <button id="camera-toggle" class="primary">Start camera</button>
          <span id="status" class="status" aria-live="polite"></span>
        </div>
      </div>

      <div id="pane-photo" role="tabpanel" aria-labelledby="tab-photo" hidden>
        <div class="stage">
          <img id="photo" alt="">
          <canvas id="photo-overlay" aria-hidden="true"></canvas>
          <label class="stage-empty drop" id="photo-empty" for="file">Choose a photo with a face</label>
        </div>
        <div class="controls">
          <label class="button primary" for="file">Choose photo</label>
          <input id="file" type="file" accept="image/*" hidden>
          <span id="photo-status" class="status" aria-live="polite"></span>
        </div>
      </div>
    </section>

    <section class="panel result" aria-label="Result">
      <div class="mood">
        <span id="emoji" class="emoji" aria-hidden="true">·</span>
        <div>
          <div id="emotion" class="emotion">No reading yet</div>
          <div id="emotion-meta" class="meta"></div>
        </div>
      </div>

      <div id="bars" class="bars" role="list" aria-label="Probability per emotion"></div>

      <div class="reco">
        <div class="reco-head">
          <h2>Suggested music</h2>
          <div class="segmented" role="radiogroup" aria-label="Strategy">
            <button role="radio" data-strategy="match" aria-checked="true">Match my mood</button>
            <button role="radio" data-strategy="lift" aria-checked="false">Lift my mood</button>
          </div>
        </div>
        <a id="reco-main" class="reco-main" target="_blank" rel="noopener noreferrer" hidden>
          <span class="reco-label">Search YouTube</span>
          <span id="reco-query" class="reco-query"></span>
        </a>
        <p id="reco-note" class="note"></p>
        <ul id="reco-alt" class="reco-alt"></ul>
      </div>
      <p class="fine">Expression is not the same as feeling: treat the result as a guess. “Contempt” is experimental (very few training images).</p>
    </section>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
